<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Angaben für Ihre Website · Bildungszentrum Sönmez</title>
<meta name="description" content="Fragebogen für die neue Website des Bildungszentrums Sönmez.">
<meta name="theme-color" content="#0b2f5c">
<link rel="stylesheet" href="schriften/fonts.css">
<style>
:root{
  --bg:oklch(0.985 0.004 245);
  --surface:oklch(1 0 0);
  --sunk:oklch(0.955 0.007 245);
  --ink:oklch(0.25 0.025 252);
  --muted:oklch(0.49 0.022 252);
  --line:oklch(0.89 0.012 245);
  --blau:oklch(0.42 0.115 252);
  --blau-hell:oklch(0.95 0.02 252);
  --rot:oklch(0.52 0.19 27);
  --gruen:oklch(0.50 0.10 158);
  --auf-blau:oklch(1 0 0);

  --s1:.25rem; --s2:.5rem; --s3:.75rem; --s4:1rem; --s5:1.5rem; --s6:2rem; --s7:3rem;
  --r:.5rem;
  --ease:cubic-bezier(.22,1,.36,1);
  --z-kopf:10; --z-fuss:20;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:oklch(0.19 0.018 250);
    --surface:oklch(0.235 0.02 250);
    --sunk:oklch(0.275 0.022 250);
    --ink:oklch(0.96 0.006 245);
    --muted:oklch(0.72 0.018 245);
    --line:oklch(0.34 0.022 250);
    --blau:oklch(0.68 0.12 250);
    --blau-hell:oklch(0.30 0.045 250);
    --rot:oklch(0.68 0.16 27);
    --gruen:oklch(0.70 0.11 158);
    --auf-blau:oklch(0.17 0.02 250);
  }
}
:root[data-theme="dark"]{
  --bg:oklch(0.19 0.018 250); --surface:oklch(0.235 0.02 250); --sunk:oklch(0.275 0.022 250);
  --ink:oklch(0.96 0.006 245); --muted:oklch(0.72 0.018 245); --line:oklch(0.34 0.022 250);
  --blau:oklch(0.68 0.12 250); --blau-hell:oklch(0.30 0.045 250); --rot:oklch(0.68 0.16 27);
  --gruen:oklch(0.70 0.11 158); --auf-blau:oklch(0.17 0.02 250);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased;
  overflow-wrap:break-word;
}
h1,h2,h3{margin:0; font-weight:700; letter-spacing:-.018em; line-height:1.18; text-wrap:balance}
h1{font-size:2.125rem}
h2{font-size:1.375rem}
h3{font-size:1.125rem}
p{margin:0}
a{color:inherit}
button{font:inherit; color:inherit}
.spalte{width:min(34rem,100% - 2rem); margin-inline:auto}
.zahl{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--blau); outline-offset:2px; border-radius:4px}

/* ══════ Kopf ══════ */
.kopf{
  position:sticky; top:0; z-index:var(--z-kopf); background:var(--bg);
  border-bottom:1px solid var(--line); padding-top:env(safe-area-inset-top);
}
.kopf-innen{display:flex; align-items:center; gap:var(--s3); padding-block:var(--s3)}
.kopf-titel{flex:1; min-width:0}
.kopf-titel b{display:block; font-size:.9375rem; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.kopf-titel span{display:block; font-size:.78rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.kopf-notiz{display:none}
@media (min-width:26rem){.kopf-notiz{display:inline}}
.balken{height:4px; background:var(--line)}
.balken i{display:block; height:100%; background:var(--blau); transform-origin:left center; transform:scaleX(0); transition:transform .18s var(--ease)}

/* ══════ Bühne ══════ */
main{padding-block:var(--s6) 8rem}
.etappe{animation:auf .18s var(--ease) both}
@keyframes auf{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
.etappe-kopf{margin-bottom:var(--s6)}
.etappe-kopf h2{margin-bottom:var(--s2)}
.etappe-kopf p{color:var(--muted); font-size:.9375rem}

/* ══════ Frage ══════ */
.frage{padding-block:var(--s5); border-top:1px solid var(--line)}
.frage:first-of-type{border-top:0; padding-top:0}
.frage > label, .frage-titel{display:block; font-weight:600; font-size:1rem; margin-bottom:var(--s1)}
.warum{display:block; color:var(--muted); font-size:.875rem; margin-bottom:var(--s3); line-height:1.45}
.noetig{
  display:inline-flex; align-items:center; gap:.3rem; font-size:.75rem; font-weight:600;
  color:var(--rot); margin-left:var(--s2); vertical-align:1px; white-space:nowrap;
}
.noetig::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor; flex:none}

input[type=text], input[type=tel], input[type=email], textarea{
  width:100%; font:inherit; font-size:16px; color:var(--ink); background:var(--surface);
  border:1px solid var(--line); border-radius:var(--r); padding:.7rem .8rem;
  transition:border-color .18s var(--ease), box-shadow .18s var(--ease);
}
textarea{min-height:5.5rem; resize:vertical; line-height:1.5}
input::placeholder, textarea::placeholder{color:var(--muted); opacity:1}
input:hover, textarea:hover{border-color:var(--muted)}
input:focus, textarea:focus{
  outline:none; border-color:var(--blau); box-shadow:0 0 0 3px color-mix(in oklab,var(--blau) 22%,transparent);
}

/* Auswahl (eine Antwort) */
.wahl{display:flex; flex-direction:column; gap:var(--s2)}
.wahl button{
  display:flex; align-items:center; gap:var(--s3); min-height:48px; width:100%; text-align:left;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:.6rem .85rem; cursor:pointer; font-size:.9375rem;
  transition:border-color .18s var(--ease), background-color .18s var(--ease);
}
.wahl button::before{
  content:""; width:20px; height:20px; flex:none; border-radius:50%;
  border:2px solid var(--muted); transition:border-color .18s var(--ease), box-shadow .18s var(--ease);
}
.wahl button:hover{border-color:var(--muted)}
.wahl button[aria-pressed="true"]{border-color:var(--blau); background:var(--blau-hell)}
.wahl button[aria-pressed="true"]::before{
  border-color:var(--blau); box-shadow:inset 0 0 0 4px var(--surface), inset 0 0 0 20px var(--blau);
}

/* Mehrfachauswahl */
.mehrfach{display:flex; flex-direction:column; gap:var(--s2)}
.mehrfach label{
  display:flex; align-items:center; gap:var(--s3); min-height:46px; cursor:pointer;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:.5rem .85rem; font-size:.9375rem; transition:border-color .18s var(--ease), background-color .18s var(--ease);
}
.mehrfach label:hover{border-color:var(--muted)}
.mehrfach input{
  appearance:none; width:20px; height:20px; flex:none; margin:0; cursor:pointer;
  border:2px solid var(--muted); border-radius:5px; background:var(--surface); position:relative;
  transition:background-color .18s var(--ease), border-color .18s var(--ease);
}
.mehrfach input:checked{background:var(--blau); border-color:var(--blau)}
.mehrfach input:checked::after{
  content:""; position:absolute; left:5px; top:1px; width:6px; height:11px;
  border:solid var(--auf-blau); border-width:0 2.5px 2.5px 0; transform:rotate(43deg);
}
.mehrfach label:has(input:checked){border-color:var(--blau); background:var(--blau-hell)}

/* Leistung + Preis */
.leistungen{display:flex; flex-direction:column; gap:var(--s2)}
.leistung{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:.5rem .85rem; transition:border-color .18s var(--ease), background-color .18s var(--ease);
}
.leistung:has(input[type=checkbox]:checked){border-color:var(--blau); background:var(--blau-hell)}
.leistung > label{display:flex; align-items:center; gap:var(--s3); min-height:44px; cursor:pointer; font-size:.9375rem}
.leistung input[type=checkbox]{
  appearance:none; width:20px; height:20px; flex:none; margin:0; cursor:pointer;
  border:2px solid var(--muted); border-radius:5px; background:var(--surface); position:relative;
}
.leistung input[type=checkbox]:checked{background:var(--blau); border-color:var(--blau)}
.leistung input[type=checkbox]:checked::after{
  content:""; position:absolute; left:5px; top:1px; width:6px; height:11px;
  border:solid var(--auf-blau); border-width:0 2.5px 2.5px 0; transform:rotate(43deg);
}
.preis-zeile{display:none; flex-wrap:wrap; gap:var(--s1) var(--s2); align-items:center; padding:0 0 var(--s2) 2.1rem}
.leistung:has(input[type=checkbox]:checked) .preis-zeile{display:flex}
.preis-zeile input{width:8.5rem; flex:none; font-size:16px}
.preis-zeile span{font-size:.8125rem; color:var(--muted); flex:1; min-width:9rem; line-height:1.35}

/* Folgefeld */
.folge{margin-top:var(--s3); padding-left:var(--s4); border-left:1px solid var(--line)}
.folge label{display:block; font-size:.875rem; font-weight:600; margin-bottom:var(--s2)}

/* ══════ Fuß ══════ */
.fuss{
  position:fixed; left:0; right:0; bottom:0; z-index:var(--z-fuss); background:var(--bg);
  border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom);
}
.fuss-innen{display:flex; gap:var(--s3); align-items:center; padding-block:var(--s3)}
.knopf{
  display:inline-flex; align-items:center; justify-content:center; gap:var(--s2);
  min-height:48px; padding:0 1.15rem; border-radius:var(--r); border:1px solid var(--line);
  background:var(--surface); color:var(--ink); cursor:pointer; font-weight:600; font-size:1rem; text-decoration:none;
  transition:background-color .18s var(--ease), border-color .18s var(--ease), opacity .18s var(--ease);
}
.knopf:hover{border-color:var(--muted)}
.knopf-haupt{background:var(--blau); border-color:var(--blau); color:var(--auf-blau); flex:1}
.knopf-haupt:hover{border-color:var(--blau); filter:brightness(1.08)}
.knopf[disabled]{opacity:.4; cursor:default}
.gespeichert{
  font-size:.8125rem; color:var(--gruen); text-align:center; height:1.1rem; padding-bottom:var(--s1);
  opacity:0; transition:opacity .18s var(--ease);
}
.gespeichert.an{opacity:1}

/* ══════ Start & Ende ══════ */
.start-marke{
  display:inline-flex; align-items:center; gap:var(--s3); background:var(--sunk);
  border-radius:var(--r); padding:var(--s3) var(--s4); margin-bottom:var(--s5);
}
.start-marke svg{width:26px; height:26px; flex:none; color:var(--blau)}
.start-marke b{font-size:.9375rem}
.start-marke span{display:block; font-size:.8125rem; color:var(--muted)}
.start p{color:var(--muted); margin-top:var(--s4)}
.start h1{margin-bottom:var(--s4)}
.start .fuehrt{color:var(--ink); font-size:1.0625rem}
.punkte{list-style:none; margin:var(--s5) 0 0; padding:0; display:flex; flex-direction:column; gap:var(--s3)}
.punkte li{display:flex; gap:var(--s3); align-items:flex-start; font-size:.9375rem; color:var(--muted)}
.punkte svg{width:19px; height:19px; flex:none; margin-top:.2rem; color:var(--blau)}

.uebersicht{background:var(--sunk); border-radius:var(--r); padding:var(--s4); margin-block:var(--s5)}
.uebersicht h3{font-size:.9375rem; margin-bottom:var(--s3)}
.uebersicht dl{margin:0; display:flex; flex-direction:column; gap:var(--s3)}
.uebersicht dt{font-size:.8125rem; color:var(--muted)}
.uebersicht dd{margin:0; font-size:.9375rem; white-space:pre-wrap}
.uebersicht .leer{color:var(--muted); font-style:italic}
.schritt{display:flex; gap:var(--s3); align-items:flex-start; margin-bottom:var(--s4)}
.schritt .nr{
  width:26px; height:26px; flex:none; border-radius:50%; background:var(--blau); color:var(--auf-blau);
  display:grid; place-items:center; font-size:.8125rem; font-weight:700;
}
.schritt p{font-size:.9375rem}
.schritt b{display:block; margin-bottom:.1rem}
.hinweis{font-size:.875rem; color:var(--muted); background:var(--sunk); border-radius:var(--r); padding:var(--s3) var(--s4); margin-top:var(--s4)}

.fussnote{border-top:1px solid var(--line); margin-top:var(--s7); padding-top:var(--s4); font-size:.8125rem; color:var(--muted)}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:0s !important; animation-duration:0s !important}
}
</style>
</head>
<body>

</header>

<footer class="fuss" id="fuss" hidden>
  <div class="spalte">

      <button type="button" class="knopf knopf-haupt" id="weiter">Weiter</button>

  </div>
</footer>

  /* ══════════════════════════════════════════════════════════
     Zustand
     ══════════════════════════════════════════════════════════ */
  var daten = {};
  try { daten = JSON.parse(localStorage.getItem(SPEICHER) || "{}"); } catch(e){ daten = {}; }
  var ansicht = typeof daten.__ansicht === "number" ? daten.__ansicht : -1;   // -1 = Start, ETAPPEN.length = Ende

  var buehne = document.getElementById("buehne");
  var kopf = document.getElementById("kopf");
  var fuss = document.getElementById("fuss");
  var kopfTitel = document.getElementById("kopfTitel");
  var kopfZahl = document.getElementById("kopfZahl");
  var balken = document.getElementById("balken");
  var gespeichert = document.getElementById("gespeichert");
  var bZurueck = document.getElementById("zurueck");
  var bWeiter = document.getElementById("weiter");
  var speicherUhr;

  function sichern(){
    daten.__ansicht = ansicht;
    try {
      localStorage.setItem(SPEICHER, JSON.stringify(daten));
      clearTimeout(speicherUhr);
      gespeichert.classList.add("an");
      speicherUhr = setTimeout(function(){ gespeichert.classList.remove("an"); }, 1600);
    } catch(e){
      gespeichert.textContent = "Konnte nicht gespeichert werden — bitte in einem Zug ausfüllen.";
      gespeichert.style.color = "var(--rot)";
      gespeichert.classList.add("an");
    }
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  /* ══════════════════════════════════════════════════════════
     Aufbau der Felder
     ══════════════════════════════════════════════════════════ */
  function feldBauen(f){
    var w = document.createElement("div");
    w.className = "frage";
    var titelId = "f-" + f.id;
    var noetig = f.noetig ? '<span class="noetig">brauchen wir</span>' : "";

    if(f.typ === "text" || f.typ === "tel" || f.typ === "email" || f.typ === "textarea"){
      var art = f.typ === "textarea" ? "textarea" : "input";
      w.innerHTML =
        '<label for="'+titelId+'">'+esc(f.frage)+noetig+'</label>' +
        (f.warum ? '<span class="warum">'+esc(f.warum)+'</span>' : "") +
        (art === "textarea"
          ? '<textarea id="'+titelId+'" placeholder="'+esc(f.platzhalter||"")+'"></textarea>'
          : '<input type="'+(f.typ==="text"?"text":f.typ)+'" id="'+titelId+'" placeholder="'+esc(f.platzhalter||"")+'">');
      var eingabe = w.querySelector("#"+CSS.escape(titelId));
      eingabe.value = daten[f.id] || "";
      eingabe.addEventListener("input", function(){ daten[f.id] = eingabe.value; sichern(); });
      return w;
    }

    if(f.typ === "wahl"){
      w.innerHTML =
        '<span class="frage-titel" id="'+titelId+'">'+esc(f.frage)+noetig+'</span>' +
        (f.warum ? '<span class="warum">'+esc(f.warum)+'</span>' : "") +
        '<div class="wahl" role="group" aria-labelledby="'+titelId+'"></div>' +
        '<div class="folge-halter"></div>';
      var box = w.querySelector(".wahl");
      var halter = w.querySelector(".folge-halter");

      f.optionen.forEach(function(o){
        var b = document.createElement("button");
        b.type = "button";
        b.textContent = o;
        b.setAttribute("aria-pressed", String(daten[f.id] === o));
        b.addEventListener("click", function(){
          daten[f.id] = o;
          box.querySelectorAll("button").forEach(function(x){ x.setAttribute("aria-pressed","false"); });
          b.setAttribute("aria-pressed","true");
          folgeZeigen();
          sichern();
        });
        box.appendChild(b);
      });

      function folgeZeigen(){
        halter.innerHTML = "";
        if(!f.folge || daten[f.id] !== f.folge.wenn) return;
        var fo = f.folge, foId = "f-" + fo.id;
        var d = document.createElement("div");
        d.className = "folge";
        d.innerHTML = '<label for="'+foId+'">'+esc(fo.frage)+'</label>' +
                      '<input type="text" id="'+foId+'" placeholder="'+esc(fo.platzhalter||"")+'">';
        var ein = d.querySelector("input");
        ein.value = daten[fo.id] || "";
        ein.addEventListener("input", function(){ daten[fo.id] = ein.value; sichern(); });
        halter.appendChild(d);
      }
      folgeZeigen();
      return w;
    }

    if(f.typ === "mehrfach"){
      w.innerHTML =
        '<span class="frage-titel" id="'+titelId+'">'+esc(f.frage)+noetig+'</span>' +
        (f.warum ? '<span class="warum">'+esc(f.warum)+'</span>' : "") +
        '<div class="mehrfach" role="group" aria-labelledby="'+titelId+'"></div>';
      var mbox = w.querySelector(".mehrfach");
      var gewaehlt = Array.isArray(daten[f.id]) ? daten[f.id] : [];

      f.optionen.forEach(function(o){
        var l = document.createElement("label");
        var cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = gewaehlt.indexOf(o) > -1;
        cb.addEventListener("change", function(){
          var liste = Array.isArray(daten[f.id]) ? daten[f.id] : [];
          if(cb.checked){ if(liste.indexOf(o) < 0) liste.push(o); }
          else { liste = liste.filter(function(x){ return x !== o; }); }
          daten[f.id] = liste;
          sichern();
        });
        l.appendChild(cb);
        l.appendChild(document.createTextNode(o));
        mbox.appendChild(l);
      });
      return w;
    }

    if(f.typ === "leistungen"){
      w.innerHTML =
        '<span class="frage-titel" id="'+titelId+'">'+esc(f.frage)+noetig+'</span>' +
        (f.warum ? '<span class="warum">'+esc(f.warum)+'</span>' : "") +
        '<div class="leistungen" role="group" aria-labelledby="'+titelId+'"></div>';
      var lbox = w.querySelector(".leistungen");
      var stand = (daten[f.id] && typeof daten[f.id] === "object") ? daten[f.id] : {};
      daten[f.id] = stand;

      f.optionen.forEach(function(o, i){
        var zeile = document.createElement("div");
        zeile.className = "leistung";
        var pid = "p-" + f.id + "-" + i;
        zeile.innerHTML =
          '<label><input type="checkbox">' + esc(o) + '</label>' +
          '<div class="preis-zeile"><input type="text" id="'+pid+'" placeholder="Preis" aria-label="Preis für '+esc(o)+'"><span>z. B. 95 €, 450–550 € oder „auf Anfrage“</span></div>';
        var cb = zeile.querySelector('input[type=checkbox]');
        var pr = zeile.querySelector('.preis-zeile input');
        cb.checked = Object.prototype.hasOwnProperty.call(stand, o);
        pr.value = stand[o] || "";
        cb.addEventListener("change", function(){
          if(cb.checked){ stand[o] = pr.value || ""; } else { delete stand[o]; }
          sichern();
          if(cb.checked) pr.focus();
        });
        pr.addEventListener("input", function(){ stand[o] = pr.value; sichern(); });
        lbox.appendChild(zeile);
      });
      return w;
    }

    return w;
  }

  function symbol(pfad){

  function etappeZeigen(){
    var e = ETAPPEN[ansicht];
    kopf.hidden = false; fuss.hidden = false;
    kopfTitel.textContent = e.titel;
    kopfZahl.textContent = (ansicht + 1) + " von " + ETAPPEN.length;
    balken.style.transform = "scaleX(" + (ansicht / ETAPPEN.length) + ")";
    requestAnimationFrame(function(){
      balken.style.transform = "scaleX(" + ((ansicht + 1) / ETAPPEN.length) + ")";
    });

    var d = document.createElement("div");
    d.className = "etappe";
    var k = document.createElement("div");
    k.className = "etappe-kopf";
    k.innerHTML = "<h2>" + esc(e.titel) + "</h2>" + (e.intro ? "<p>" + esc(e.intro) + "</p>" : "");
    d.appendChild(k);
    e.felder.forEach(function(f){ d.appendChild(feldBauen(f)); });
    buehne.innerHTML = "";
    buehne.appendChild(d);

    bZurueck.disabled = false;
    bZurueck.textContent = "Zurück";
    bWeiter.textContent = (ansicht === ETAPPEN.length - 1) ? "Fertig" : "Weiter";
    daten.__letzte = ansicht;
    window.scrollTo(0, 0);
  }

      liste += '<h3>' + esc(e.titel) + '</h3><dl>';
      e.felder.forEach(function(f){
        var wert = wertLesbar(f);
        liste += '<dt>' + esc(f.frage) + '</dt><dd' + (wert ? '' : ' class="leer"') + '>' + esc(wert || "— offen gelassen") + '</dd>';

          liste += '<dt>' + esc(f.folge.frage) + '</dt><dd>' + esc(daten[f.folge.id]) + '</dd>';

    buehne.innerHTML =
      '<div class="etappe">' +
        '<h1>Danke, Herr Sönmez.</h1>' +
        '<p style="color:var(--muted); margin-top:1rem">Das war alles. Schicken Sie Ihre Antworten jetzt an Aleksandar — zwei Schritte, dann sind Sie fertig.</p>' +

          '<div class="schritt" style="margin-top:2rem"><span class="nr">2</span><p><b>In WhatsApp einfügen und senden</b>Der Chat mit Aleksandar öffnet sich. Lange auf das Textfeld tippen, „Einfügen“ wählen, absenden.</p></div>' +

        '<p class="hinweis">Logo und Fotos schicken Sie am besten direkt hinterher in denselben Chat. Falls beim Kopieren etwas klemmt: Aleksandar erreichen Sie unter 0176 43478923.</p>' +'<p class="hinweis" style="margin-top:.75rem">Sobald Ihre Antworten da sind, bereite ich alles auf, damit Aleksandar direkt mit dem Bau anfangen kann. Sie bekommen dann mehrere Entwürfe zu sehen und suchen sich aus, welcher es wird.</p>' +
        '<div class="uebersicht">' +
          '<h3>Ihre Angaben zum Nachlesen</h3>' + liste +
        '</div>' +
        '<div style="display:flex; gap:.75rem; flex-wrap:wrap">' +
          '<button type="button" class="knopf" id="zurueckEnde">Noch einmal durchgehen</button>' +
        '</div>' +
        '<p class="fussnote">ILION · KI-Partner von ILIC ECOM HUB</p>' +
      '</div>';

    var kn = document.getElementById("kopieren");
    kn.addEventListener("click", function(){
      function erfolg(){
        kn.textContent = "Kopiert — weiter mit Schritt 2";
        setTimeout(function(){ kn.textContent = "Antworten kopieren"; }, 3000);
      }
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(erfolg, ersatzKopie);
      } else { ersatzKopie(); }
      function ersatzKopie(){
        var ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); erfolg(); }
        catch(e){ kn.textContent = "Bitte den Text unten von Hand kopieren"; }
        document.body.removeChild(ta);
      }
    });
    document.getElementById("zurueckEnde").addEventListener("click", function(){
      ansicht = 0; zeigen();
    });
    window.scrollTo(0, 0);
  }

  function wertLesbar(f){
    var v = daten[f.id];
    if(v === undefined || v === null || v === "") return "";
    if(Array.isArray(v)) return v.length ? v.join(", ") : "";
    if(typeof v === "object"){
      var t = Object.keys(v).map(function(k){
        return "· " + k + (v[k] ? ": " + v[k] : ": Preis offen");
      });
      return t.length ? t.join("\n") : "";
    }
    return String(v);
  }

  function textBauen(){
    var z = ["ANGABEN FÜR DIE WEBSITE", "Bildungszentrum Sönmez", "(ausgefüllt über die Fragenseite von ILION)", ""];
    ETAPPEN.forEach(function(e){
      var block = [];
      e.felder.forEach(function(f){
        var w = wertLesbar(f);
        if(w) block.push(f.frage + "\n" + w);
        if(f.folge && daten[f.folge.id]) block.push(f.folge.frage + "\n" + daten[f.folge.id]);
      });
      if(block.length){
        z.push("— " + e.titel.toUpperCase() + " —");
        z.push(block.join("\n\n"));
        z.push("");
      }
    });
    return z.join("\n").trim();
  }

  function zeigen(){
    if(ansicht < 0) startZeigen();
    else if(ansicht >= ETAPPEN.length) endeZeigen();
    else etappeZeigen();
    sichern();
  }

  bZurueck.addEventListener("click", function(){ ansicht--; zeigen(); });
  bWeiter.addEventListener("click", function(){ ansicht++; zeigen(); });

  zeigen();
})();
</script>
